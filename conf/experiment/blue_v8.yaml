# @package _global_
# blue_v8 — pretrained from blue_v7 (best_model), adds GoalSideCone
# positional shaper to fix blue_v7's "flies away then maybe comes back"
# behavior.  Same obs (DUEL_V3_BODY_EGO 75-d) so no surgery needed.
# Same opponent + curriculum + intercept term as blue_v7; only the
# reward stack changes.

run_name: ppo_hoop_blue_8

defaults:
  - override /env: team
  - override /obs: duel_v3_body_ego
  - override /reward: team_v4_cone
  - override /opponent: frozen
  - override /init: pretrain
  - override /curriculum: random_start

env:
  learner_id: blue_0
  team_env_params:
    midpoint_alpha: 0.6              # unchanged from blue_v7; obs target only

init:
  parent: runs/ppo_hoop_blue_7/20260518_194604/best_model

opponent:
  model_path: models/ppo_hoop_red_1_20260506_103058/best_model

trainer:
  lr: 3e-4
  total_timesteps: 10_000_000
