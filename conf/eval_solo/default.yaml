# Hydra entrypoint config for scripts/eval_solo.py (single-agent).
#
# Compose:
#   python -m scripts.eval_solo +eval_solo=default \
#       eval_solo.model_uri=models/ppo_hoop_rand_start_*/best_model \
#       eval.gui=true eval.n_episodes=10
#
# Reads cfg.eval (shared) + cfg.eval_solo (single-agent specifics) from
# the composed cfg.

# Single-agent eval doesn't take a learner group or an opponent — just the
# model URI as `model_uri`.
model_uri: ???
n_episodes: 10              # default: more than the team-eval default (5),
                            # matches the historical single-agent default.
