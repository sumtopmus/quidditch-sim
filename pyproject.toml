[project]
name = "quidditch-sim"
version = "0.1.0"
description = "MuJoCo-based quidditch simulator for RL drone training."
requires-python = ">=3.13,<3.14"
dependencies = [
    "mujoco>=3.0",
    "stable-baselines3",
    "tqdm",
    "rich",
    "wandb>=0.16",
    "imageio",
    "imageio-ffmpeg",
    "moviepy<2.0",
    "pettingzoo>=1.24",
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: integration tests — real episode loops, full canaries, warm-start. `make test-fast` skips these via -m 'not slow'.",
]
